<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Explain Difficulty workflow</title>
  <desc id="desc">A question-by-model response matrix is fitted with IRT. Question text and fitted difficulty are used in 30 group and 50 pair contrast rounds. Hypotheses are refined, matched and selected using stability Lasso.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" stroke="#8A9AAE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="grid" width="25" height="21" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="20" height="16" rx="3" fill="#DCE7F2"/></pattern>
  </defs>
  <rect x="1" y="1" width="1118" height="278" rx="16" fill="#F8FAFC" stroke="#E1E7EF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="32" font-size="12" font-weight="700" letter-spacing="1.6" fill="#69788D">FROM RESPONSES TO EXPLANATIONS</text>
    <rect x="24" y="54" width="238" height="182" rx="12" fill="white" stroke="#DCE3EC"/>
    <rect x="298" y="54" width="238" height="182" rx="12" fill="white" stroke="#DCE3EC"/>
    <rect x="572" y="54" width="238" height="182" rx="12" fill="white" stroke="#DCE3EC"/>
    <rect x="846" y="54" width="250" height="182" rx="12" fill="white" stroke="#DCE3EC"/>
    <g stroke="#8A9AAE" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M271 147H289"/><path d="M545 147H563"/><path d="M819 147H837"/>
    </g>
    <g fill="#233247" font-size="18" font-weight="700">
      <text x="43" y="83">Model responses</text><text x="317" y="83">Fit IRT</text>
      <text x="591" y="83">Contrast questions</text><text x="865" y="83">Select hypotheses</text>
    </g>
    <rect x="75" y="105" width="150" height="84" rx="5" fill="url(#grid)"/>
    <g fill="#4C7DB0">
      <rect x="77" y="107" width="20" height="16" rx="3"/><rect x="127" y="107" width="20" height="16" rx="3"/>
      <rect x="102" y="128" width="20" height="16" rx="3"/><rect x="177" y="128" width="20" height="16" rx="3"/>
      <rect x="77" y="149" width="20" height="16" rx="3"/><rect x="152" y="149" width="20" height="16" rx="3"/>
      <rect x="127" y="170" width="20" height="16" rx="3"/><rect x="202" y="170" width="20" height="16" rx="3"/>
    </g>
    <path d="M322 184H511" stroke="#DCE3EC"/>
    <g fill="#8EA9C8">
      <rect x="332" y="156" width="21" height="28" rx="3"/><rect x="363" y="139" width="21" height="45" rx="3"/>
      <rect x="394" y="124" width="21" height="60" rx="3"/><rect x="425" y="146" width="21" height="38" rx="3"/>
    </g>
    <g fill="#CE7A35"><rect x="456" y="108" width="21" height="76" rx="3"/><rect x="487" y="117" width="21" height="67" rx="3"/></g>
    <rect x="591" y="105" width="200" height="36" rx="7" fill="#EEF3F9"/>
    <rect x="591" y="151" width="200" height="36" rx="7" fill="#EDF5F0"/>
    <g font-size="14" font-weight="700">
      <text x="604" y="128" fill="#426995">30 group rounds</text><text x="604" y="174" fill="#357455">50 pair rounds</text>
    </g>
    <g font-size="14" fill="#4B5E74">
      <text x="887" y="119">Refine candidate text</text><text x="887" y="149">Match properties to items</text><text x="887" y="179">Rank by stability Lasso</text>
    </g>
    <g fill="#CE7A35"><circle cx="870" cy="114" r="4"/><circle cx="870" cy="144" r="4"/><circle cx="870" cy="174" r="4"/></g>
    <g fill="#69788D" font-size="12.5" text-anchor="middle">
      <text x="143" y="218">questions × models</text><text x="417" y="218">item difficulty + model ability</text>
      <text x="691" y="218">question text + IRT difficulty</text><text x="971" y="218">hypotheses + matching matrix</text>
    </g>
    <text x="28" y="259" font-size="12" fill="#69788D">Two packages: irt / hypotheses</text>
    <text x="1092" y="259" text-anchor="end" font-size="12" fill="#69788D">Generation: G     ·     Selection: V     ·     Held out: T</text>
  </g>
</svg>
